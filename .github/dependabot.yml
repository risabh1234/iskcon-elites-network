version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # One PR per family rather than fifteen. A framework bump that arrives in
      # pieces gets reviewed in pieces, which is how a mismatched set lands.
      next:
        patterns: ["next", "@next/*", "eslint-config-next", "@opennextjs/*"]
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      prisma:
        patterns: ["prisma", "@prisma/*"]
      tooling:
        patterns: ["vitest", "@vitest/*", "@playwright/*", "playwright", "eslint*", "typescript"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
